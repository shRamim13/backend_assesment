info:
  name: Create Great Grandchild
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/api/categories"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{"name": "Smart Watch", "parentId": "{{grandchildId}}"}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
